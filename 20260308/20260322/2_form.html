<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>個人資料</legend>
            <label for="name">使用者名稱：

                <input type="text" id="name" name="name" value="kdkd">
            </label>
            <div>
                <label>密碼：
                    <input type="password" id="password" name="password" value="" placeholder="請輸入密碼">
                </label>
            </div>
        </fieldset>
        <fieldset>
            <legend>個人介紹</legend>
            <div>
                <span>性別：</span>
                <label> <input type="radio" name="gender" value="male"> 男 </label>
                <label> <input type="radio" name="gender" value="female"> 女 </label>
                <label> <input type="radio" name="gender" value="other"> 其他 </label>
            </div>
            <div>
                <span>興趣： </span>
                <label> <input type="checkbox" name="hobby[]" value="sports"> 運動 </label>
                <label> <input type="checkbox" name="hobby[]" value="music"> 音樂 </label>
                <label> <input type="checkbox" name="hobby[]" value="travel"> 旅遊 </label>
            </div>
            <div>
                <span>居住地: </span>
                <select name="city" id="location">
                    <option value="">請選擇</option>
                    <option value="taipei" selected>台北</option>
                    <option value="taichung">台中</option>
                    <option value="kaohsiung">高雄</option>
                </select>
            </div>
            <div>
                <span>生日</span>
                <input type="datetime-local" name="birth" min="1950-01-01" max="2026-12-31" step="1">
            </div>
            <div>
                <span>時間</span>
                <input type="date" name="birth" min="1950-01-01" max="2026-12-31">
            </div>
            <div>
                <span>照片上傳</span>
                <input type="file" name="photo" accept="image/*">
                <span>PDF</span>
                <input type="file" name="pdf" accept="application/pdf">
            </div>
        </fieldset>
        <fieldset>
            <legend>關於我</legend>
            <div>
                <textarea name="about" id="about" cols="30" rows="10" placeholder="請輸入自我介紹">

                </textarea>
            </div>

            <div>
                <label>
                    滿意度 <input type="range" name="satisfaction" id="satisfaction" step="1" min="0" max="10" value="5">

                </label>
            </div>
        </fieldset>

        <button type="reset">重置</button>
        <button type="submit">送出</button>
        <button type="button" onclick="alert('Hello')">點我</button>
    </form>
