<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 選擇器</title>
    <style>
        h1 {
            color: blue;
        }

        .txt-green {
           color: green;
        }
        .bg-lightblue {
            background-color: lightblue;
        }
    </style>
</head>

<body>
    <h1>主標題</h1>
    <h2>次標題</h2>
    <p class="txt-green bg-lightblue">這是第一個段落，用來測試 CSS 的 color 屬性。</p>
    <p class="txt-green">這是第二個段落，我們會用它來學習不同的選擇器。</p>
    <div>這是一個 div 區塊元素。</div>
    <span>這是一個 span 行內元素。</span>
</body>

</html>
