<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table.ls1 {
            width: 700px;
            text-align: center;
            border-spacing: 10px;

            tr {
                background-color: #f2f2f2;
            }

            td {
                border: 1px solid #110202;
                padding: 8px;
            }

            tbody tr:nth-child(even) {
                background-color: red;
            }

            td:last-child {
                text-align: right;
            }
        }
    </style>
</head>

<body>
    <table class="ls1">
        <thead>
            <tr>
                <th>姓名</th>
                <th>部門</th>
                <th>職位</th>
                <th>薪資</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>張小明</td>
                <td>技術部</td>
                <td>前端工程師</td>
                <td>60,000</td>
            </tr>
            <tr>
                <td>李美華</td>
                <td>設計部</td>
                <td>UI/UX 設計師</td>
                <td>55,000</td>
            </tr>
            <tr>
                <td>王大力</td>
                <td>技術部</td>
                <td>後端工程師</td>
                <td>65,000</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
