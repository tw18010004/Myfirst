<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --primary-color: green;
            --secondary-color: #f2f2f2;
            --border-color: #110202;
        }

        .card {
            width: 500px;
            height: 300px;
            background-color: var(--primary-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;

            h2 {
                margin-top: 0;
            }

            button {
                background-color: #4CAF50;
                color: white;
                border: none;
                padding: 10px 20px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                margin-top: 20px;
                cursor: pointer;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>歡迎來到我的網站</h2>
        <p>這是一個簡單的卡片範例，展示了如何使用 CSS 來設計一個美觀的內容區塊。</p>
        <button>了解更多</button>
    </div>
</body>

</html>
