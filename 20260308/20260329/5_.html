<!DOCTYPE html>

    <title>Document</title>
    <style>
        /*偽類選擇器*/
        a:link {
            color: red;
        }

        a:visited {
            color: green;
        }

        a:hover {
            color: blue;
        }

        a:active {
            color: purple;
        }

        button:disabled {
            background-color: gray;
            color: white;
        }

        button:not(:disabled) {
            background-color: green;
            color: white;
        }

        button[disabled] {
            background-color: gray;
            color: white;
        }

        li:first-child {
            color: red;
        }

        li:last-child {
            color: blue;
        }

        li:nth-child(2) {
            color: green;
        }

        li:nth-child(2n+3) {
            background-color: purple;
            color: white;
        }

        table {
            border-collapse: collapse;
            border: 1px solid black;
        }

        table tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        table td {
            border: 1px solid black;
            padding: 8px;
        }

        section p:first-child {
            color: red;
        }

        section p:last-child {
            color: blue;
        }

        section p:nth-child(2) {
            color: green;
        }

        section p:nth-child(2n+3) {
            background-color: purple;
            color: white;
        }

        section h1:not(.blk) {
            color: red;
        }
    </style>
</head>
