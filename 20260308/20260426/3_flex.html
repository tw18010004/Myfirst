<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        background-color: lightgoldenrodyellow;
        /* width: 100%; */
        height: 400px;
        display: flex;
        /* row | row-reverse | column | column-reverse
        e  設定主軸方向 */
        flex-direction: row;
        /* nowrap | wrap | wrap-reverse  是否換行 */
        flex-wrap: wrap;

        /* 等價:  flex-direction + flex-wrap; */
        /* flex-flow: row wrap; */

        /* gap: 10px; */
        /* 多行對齊方式 */
        /* flex-start | flex-end | center | space-between | space-around | space-evenly  多行對齊方式 */
        align-content: flex-start;
        /* flex-start | flex-end | center | space-between | space-around | space-evenly  主軸對齊方式 */
        justify-content: flex-start;
        /* flex-start | flex-end | center | stretch 交叉軸對齊方式 */
        align-items: flex-start;

        /*撐滿容器*/
        .item {
            width: 100px;

            background-color: lightcoral;
            border: 1px solid black;
        }
    }
</style>

<body>

    <div class="container">
        <div class="item" style="height: 100px; width:100px">Item 1</div>
        <div class="item">Item 2<BR>kdkdkkk</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
        <div class="item">Item 6</div>
    </div>
</body>

</html>
