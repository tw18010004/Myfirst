<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛奇渡假營地 - 溫泉露營</title>
    <link rel="shortcut icon" href="media/imgPNG.ico" type="image/x-icon">

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&family=Roboto&display=swap" rel="stylesheet">


    <!-- bootstrap -->
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.css">
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

    <!-- custom css -->
    <link rel="stylesheet" href="style.css">


    <!-- fontawesome -->

    <script src="https://kit.fontawesome.com/c9fd4e778f.js" crossorigin="anonymous"></script>
    <!-- custom -->

</head>

<body>
    <!-- 廣告 -->
    <div id="jasonSlider" class="carousel slide carousel-fade" data-bs-ride="false">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#jasonSlider" data-bs-slide-to="0"></button>
            <button type="button" data-bs-target="#jasonSlider" data-bs-slide-to="1" class="active"></button>
            <button type="button" data-bs-target="#jasonSlider" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active vh-100">
                <img src="https://picsum.photos/800/400/?random=0" class="d-block w-100 h-100 object-fit-cover">
                <div class="carousel-caption d-none d-md-block">
                    <h2>First slide label</h2>
                    <p class="d-node d-md-block">Some representative placeholder content for the first slide.</p>
                </div>
            </div>
            <div class="carousel-item vh-100">
                <img src="https://picsum.photos/800/400/?random=1" class="d-block w-100 h-100 object-fit-cover">
                <div class="carousel-caption d-none d-md-block">
                    <h2>Second slide label</h2>
                    <p>Some representative placeholder content for the second slide.</p>
                </div>
            </div>
            <div class="carousel-item vh-100">
                <img src="https://picsum.photos/800/400/?random=2" class="d-block w-100 h-100 object-fit-cover">
                <div class="carousel-caption d-none d-md-block">
                    <h2>Third slide label</h2>
                    <p>Some representative placeholder content for the third slide.</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#jasonSlider" data-bs-slide="prev">
            <!-- <span class="carousel-control-prev-icon"></span> -->
            <i class="fa-solid fa-arrow-left fa-2xl bg-dark rounded-start"></i>

        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#jasonSlider" data-bs-slide="next">
            <!-- <span class="carousel-control-next-icon"></span> -->
            <i class="fa-solid fa-arrow-right fa-2xl bg-dark rounded-start"></i>

        </button>
    </div>
</body>

</html>
